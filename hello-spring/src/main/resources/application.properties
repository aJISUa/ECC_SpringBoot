spring.application.name=hello-spring

# 21강: 스프링 부트 데이터베이스 연결 설정
# H2 를 먼저 실행해 둬야 함. 최초 한 번은 jdbc:h2:~/test 로 접속해서 파일을 만들고, 그 뒤로는 tcp 로 접속
spring.datasource.url=jdbc:h2:tcp://localhost/~/test
spring.datasource.driver-class-name=org.h2.Driver
# 없으면 Wrong user name or password 오류가 남. 뒤에 공백이 있어도 같은 오류
spring.datasource.username=sa

# 24강: JPA 설정
# JPA 가 만들어서 실행하는 SQL 을 콘솔에 출력함
spring.jpa.show-sql=true
# none 은 테이블 자동 생성 기능을 끔. create 로 하면 엔티티를 보고 테이블을 만들어줌
spring.jpa.hibernate.ddl-auto=none
