<!DOCTYPE HTML>
<!-- 5강 View 환경설정: thymeleaf 템플릿 -->
<!-- xmlns:th 를 선언해야 th: 문법을 쓸 수 있음 -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<!-- ${data} 는 컨트롤러가 model 에 넣은 data 값으로 바뀜 -->
<p th:text="'안녕하세요. ' + ${data}" >안녕하세요. 손님</p>
</body>
</html>
