<!DOCTYPE HTML>
<!-- 19강 회원 리스트 -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div class="container">
    <div>
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>이름</th>
            </tr>
            </thead>
            <tbody>
            <!-- th:each 로 모델의 members 를 하나씩 꺼내서 tr 을 반복함 -->
            <!-- ${member.id} 는 getId(), ${member.name} 은 getName() 으로 값을 가져옴 -->
            <tr th:each="member : ${members}">
                <td th:text="${member.id}"></td>
                <td th:text="${member.name}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div> <!-- /container -->

</body>
</html>
